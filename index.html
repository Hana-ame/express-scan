<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>快递单号扫码识别 · M0 纯前端</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --fg:#e6e8ec; --dim:#8b93a3; --acc:#4f8cff; --ok:#3ecf8e; --warn:#ffb454; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:18px; margin:4px 0 12px; }
  h1 small { color:var(--dim); font-weight:normal; margin-left:8px; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button, .btn { background:var(--acc); color:#fff; border:0; border-radius:10px;
                 padding:12px 16px; font-size:15px; cursor:pointer; flex:1; min-width:120px; }
  .btn { display:inline-block; text-align:center; }
  label.btn input { display:none; }
  #btnStop { background:var(--bad); }
  #btnOcr { background:var(--dim); }
  #btnOcr.off { opacity:.55; }
  #btnYolo { background:var(--acc); }
  #yoloCanvas { width:100%; border-radius:12px; margin-bottom:12px; background:#000; }
  #videoWrap { position:relative; border-radius:12px; overflow:hidden; background:#000; margin-bottom:12px; }
  video { width:100%; display:block; }
  #engine { color:var(--dim); font-size:12px; margin-bottom:12px; }
  #status { color:var(--dim); font-size:13px; min-height:18px; margin-bottom:8px; white-space:pre-wrap; }
  #card { background:var(--card); border-radius:12px; padding:14px; }
  #tracking { font-size:22px; font-weight:bold; word-break:break-all; margin-bottom:8px; }
  #tracking.ok { color:var(--ok); } #tracking.partial { color:var(--warn); } #tracking.failed { color:var(--bad); }
  #meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
  pre { background:#0a0c10; border-radius:8px; padding:10px; overflow:auto; font-size:11px;
        max-height:300px; margin:0 0 10px; color:#c9d1d9; white-space:pre-wrap; word-break:break-all; }
  #btnCopy { background:var(--ok); color:#052e1c; }
  #toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%);
           background:#2a2f3a; padding:8px 16px; border-radius:20px; font-size:13px;
           opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<h1>📦 快递单号扫码识别 <small>M0 纯前端 · 零安装</small></h1>

<div class="row">
  <button id="btnCamera">📷 实时扫码</button>
  <label class="btn">🖼 拍照 / 选图
    <input id="fileInput" type="file" accept="image/*" capture="environment">
  </label>
  <button id="btnOcr">🔤 OCR 兜底：开</button>
  <button id="btnYolo">🔍 YOLO 检测</button>
  <button id="btnBench">⏱ OCR 基准</button>
</div>
<button id="btnStop" hidden>⏹ 停止</button>

<div id="videoWrap" hidden>
  <video id="video" playsinline muted></video>
  <canvas id="frame" hidden></canvas>
</div>

<canvas id="yoloCanvas" hidden></canvas>

<div id="engine"></div>
<div id="status">准备就绪：拍照上传在任何浏览器可用；实时扫码需 HTTPS 或 localhost。</div>

<div id="card">
  <div id="tracking">—</div>
  <div id="meta"></div>
  <pre id="jsonOut">（扫码后在这里显示 JSON）</pre>
  <button id="btnCopy" hidden>复制 JSON</button>
</div>

<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
 * M0 纯前端快递单号识别：BarcodeDetector（原生）+ ZXing-js（CDN 兜底）
 * 输出 JSON 与方案笔记 schema 一致：barcodes.{1d,2d} + tracking_number
 * 单号规则为示意，随快递公司版本变化，以官方为准。
 * ===================================================================== */

// ---------- 单号规则（示意） ----------
const RULES = [
  { company:'sf',    name:'顺丰',    re:/^SF\d{12}$/i },
  { company:'ems',   name:'EMS/邮政', re:/^[A-Z]{2}\d{9}CN$/i },
  { company:'yto',   name:'圆通',    re:/^(YT\d{13}|\d{13})$/i },
  { company:'zto',   name:'中通',    re:/^\d{12,14}$/ },
  { company:'yunda', name:'韵达',    re:/^\d{13}$/ },
  { company:'sto',   name:'申通',    re:/^\d{12,15}$/ },
  { company:'jd',    name:'京东',    re:/^(JD\d{12,13}|\d{13})$/i },
  { company:'dbl',   name:'德邦',    re:/^(DBL|DPK)\d{10,12}$/i },
];
function matchRule(s) {
  s = String(s || '').replace(/\s+/g, '').toUpperCase();
  for (const r of RULES) if (r.re.test(s)) return r;
  return null;
}

// ---------- 格式分类 ----------
const FMT_1D = new Set(['code_128','code_39','code_93','codabar','ean_13','ean_8','upc_a','upc_e','itf']);
const FMT_2D = new Set(['qr_code','data_matrix','aztec','pdf417']);
function classify(fmt) { return FMT_2D.has(fmt) ? '2d' : '1d'; }

// ---------- 引擎初始化：原生 BarcodeDetector → ZXing CDN 兜底 ----------
let engine = null;              // {kind:'native', detector} | {kind:'zxing', reader}
const ZXING_URLS = [
  'https://unpkg.com/@zxing/browser@0.1.5/dist/browser.min.js',
  'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/dist/browser.min.js',
];
function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = () => res(); s.onerror = () => rej(new Error('加载失败 ' + url));
    document.head.appendChild(s);
  });
}
async function initEngine() {
  if ('BarcodeDetector' in window) {
    const full = ['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix','aztec','pdf417'];
    const min  = ['code_128','code_39','ean_13','ean_8','qr_code'];
    for (const fmts of [full, min]) {
      try { engine = { kind:'native', detector: new BarcodeDetector({ formats: fmts }) }; return; } catch (e) { /* 换最小集重试 */ }
    }
  }
  for (const url of ZXING_URLS) {
    try { await loadScript(url); if (window.ZXing && window.ZXing.BrowserMultiFormatReader) {
      engine = { kind:'zxing', reader: new window.ZXing.BrowserMultiFormatReader() }; return; } } catch (e) { /* 换下一个源 */ }
  }
  throw new Error('当前浏览器无 BarcodeDetector 且 ZXing CDN 加载失败，请换 Chrome/Safari 新版');
}

// ---------- 结果归一化 ----------
function zxingFmtName(f) {
  try {
    const B = window.ZXing && window.ZXing.BarcodeFormat;
    if (B) for (const k in B) if (B[k] === f) return String(k).toLowerCase();
    if (f && f.name) return String(f.name).toLowerCase();
  } catch (e) {}
  return 'unknown';
}
function zxingPoints(r) {
  const pts = r.getResultPoints && r.getResultPoints();
  if (!pts) return [];
  return pts.filter(Boolean).map(p => [Math.round(p.getX()), Math.round(p.getY())]);
}
function nativeItems(dets) {
  return dets.filter(d => d.rawValue).map(d => ({
    format: String(d.format || '').toLowerCase(),
    data: d.rawValue,
    points: (d.cornerPoints || []).map(p => [Math.round(p.x), Math.round(p.y)]),
  }));
}
function buildJson(items, srcName, t0) {
  const b1 = [], b2 = [];
  for (const it of items) {
    const bucket = classify(it.format) === '2d' ? b2 : b1;
    bucket.push({ format: (it.format || 'unknown').toUpperCase(), data: it.data, points: it.points || [], confidence: 0.99 });
  }
  let tn = null;
  for (const it of items) {
    const r = matchRule(it.data);
    if (r) {
      tn = { value: it.data.replace(/\s+/g, '').toUpperCase(), company: r.company, company_name: r.name,
             method: classify(it.format) === '2d' ? 'barcode_2d' : 'barcode_1d',
             confidence: 1.0, status: 'ok' };
      break;
    }
  }
  return {
    request_id: (crypto.randomUUID ? crypto.randomUUID() : 'r' + Math.random().toString(36).slice(2)),
    status: tn ? 'ok' : (items.length ? 'partial' : 'failed'),
    latency_ms: Math.round(performance.now() - t0),
    source: srcName,
    barcodes: { '1d': b1, '2d': b2 },
    ocr: { full_text: null, lines: [], tracking_number: tn },   // OCR 兜底属 M1，本期留空
  };
}
function render(json) {
  const el = document.getElementById('tracking'), meta = document.getElementById('meta');
  const tn = json.ocr.tracking_number;
  el.className = json.status;
  if (tn) { el.textContent = '【' + tn.value + '】 ' + (tn.company_name || ''); }
  else if (json.status === 'partial') { el.textContent = '扫到条码，但未识别为快递单号'; }
  else { el.textContent = '未识别到条码 / 单号'; }
  meta.textContent = 'status=' + json.status + ' · latency=' + json.latency_ms + 'ms · ' + json.source
    + ' · 1d=' + json.barcodes['1d'].length + ' · 2d=' + json.barcodes['2d'].length
    + (json.ocr && json.ocr.tracking_number ? ' · ocr=hit' : (json.ocr && json.ocr.lines && json.ocr.lines.length ? ' · ocr=no_hit' : ' · ocr=off'))
    + (json.yolo ? ' · yolo=' + json.yolo.detections.length : '');
  document.getElementById('jsonOut').textContent = JSON.stringify(json, null, 2);
  document.getElementById('btnCopy').hidden = false;
  lastJson = json;
}
let lastJson = null;
let lastFile = null;

// ---------- 拍照/选图上传（任何环境可用） ----------
async function onFile(file) {
  lastFile = file;
  const t0 = performance.now();
  status('正在解码条码…');
  let items = [];
  try {
    if (engine.kind === 'native') {
      const bmp = await createImageBitmap(file);
      items = nativeItems(await engine.detector.detect(bmp));
      bmp.close();
    } else {
      const r = await engine.reader.decodeFromImageFile(file);
      items = [{ format: zxingFmtName(r.getBarcodeFormat()), data: r.getText(), points: zxingPoints(r) }];
    }
  } catch (e) { items = []; }
  let json = buildJson(items, 'photo', t0);
  // OCR 兜底：仅当条码未出有效单号时触发（保证 fallback，失败即跳过，不影响条码结果）
  if (json.status !== 'ok' && ocrEnabled) {
    const ocr = await runOcr(file);
    if (ocr) {
      json.ocr = ocr;
      if (ocr.tracking_number) { json.status = 'ok'; }
    }
  }
  render(json);
  const ocrMethod = json.ocr && json.ocr.tracking_number && json.ocr.tracking_number.method === 'ocr';
  status(json.status === 'ok'
    ? (ocrMethod ? '✅ OCR 兜底命中：' + json.ocr.tracking_number.value : '✅ 解码完成')
    : (items.length ? '扫到条码但未识别为快递单号；OCR 兜底' + (json.ocr ? ' 已尝试未命中' : ' 未触发') : '未检出条码：拍正、光线均匀' + (json.ocr ? '；OCR 兜底已尝试未命中' : (ocrEnabled ? '；OCR 兜底触发中…' : '；OCR 兜底已关闭'))));
}

// ---------- 实时扫码 ----------
const video = document.getElementById('video'), frame = document.getElementById('frame');
const fctx = frame.getContext('2d');
let stream = null, liveTimer = null, zxingControls = null;
async function startLive() {
  const wrap = document.getElementById('videoWrap');
  wrap.hidden = false; document.getElementById('btnStop').hidden = false;
  status('正在开启相机…（实时扫码需 HTTPS 或 localhost；file:// 可能被浏览器拒绝，可用拍照上传）');
  try {
    if (engine.kind === 'zxing') {
      zxingControls = await engine.reader.decodeFromVideoDevice(undefined, video, res => {
        if (res) { stopLive(); render(buildJson([{ format: zxingFmtName(res.getBarcodeFormat()), data: res.getText(), points: zxingPoints(res) }], 'live', performance.now())); }
      });
    } else {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream; await video.play();
      liveTimer = setInterval(scanFrame, 250);
    }
  } catch (e) {
    status('相机打不开：' + e.message + ' —— 请用"拍照/选图"上传');
    stopLive();
  }
}
async function scanFrame() {
  if (!video.videoWidth) return;
  const w = Math.min(video.videoWidth, 960);
  const h = Math.round(video.videoHeight * w / video.videoWidth);
  frame.width = w; frame.height = h;
  fctx.drawImage(video, 0, 0, w, h);
  let dets = [];
  try { dets = await engine.detector.detect(frame); } catch (e) {}
  const found = dets.filter(d => d.rawValue);
  if (found.length) {
    stopLive();
    render(buildJson(nativeItems(found), 'live', performance.now()));
  }
}
function stopLive() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  if (zxingControls) { try { zxingControls.stop(); } catch (e) {} zxingControls = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  document.getElementById('videoWrap').hidden = true;
  document.getElementById('btnStop').hidden = true;
}

// ---------- OCR 兜底（扩展功能 M1：条码失效时用 Tesseract.js 提取单号） ----------
// 保证 fallback：引擎/模型/网络任一失败 → 返回 null，调用方跳过，条码结果不受影响。
// 升级位：PaddleOCR.js（官方 PP-OCRv5 浏览器 SDK）待核实 API 后可在 loadOcrEngine 里前置接入。
let ocrWorker = null;
let ocrEnabled = true;
const OCR_LANG = 'chi_sim';
const OCR_LANG_PATH = './models/';   // chi_sim.traineddata.gz 同源托管；jsdelivr gh 分支是 gh-pages 且文件超其 20MB 上限，CDN 不可用
async function loadOcrEngine() {
  if (ocrWorker) return true;
  if (typeof Tesseract === 'undefined') {
    try { await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'); } catch (e) {}
    if (typeof Tesseract === 'undefined') return false;
  }
  try {
    ocrWorker = await Tesseract.createWorker(OCR_LANG, 1, { langPath: OCR_LANG_PATH });
    return true;
  } catch (e) { return false; }
}
async function runOcr(file) {
  const t0 = performance.now();
  status('条码未命中 → OCR 兜底：加载引擎/模型…（首次需联网下载，之后有缓存）');
  const ok = await loadOcrEngine();
  if (!ok) { status('OCR 引擎/模型加载失败（离线或 CDN 不可达）——已跳过，条码结果不受影响'); return null; }
  status('OCR 识别中…（首次下载模型可能较慢）');
  try {
    const { data } = await ocrWorker.recognize(file);
    const lines = [];
    for (const block of data.blocks || [])
      for (const par of block.paragraphs || [])
        for (const ln of par.lines || []) {
          const text = (ln.text || '').trim();
          if (text) lines.push({ text, confidence: Math.round(((ln.confidence || 0) / 100) * 100) / 100 });
        }
    const full_text = lines.map(l => l.text).join('\n');
    let tn = null;
    for (const l of lines) {
      const r = matchRule(l.text);
      if (r) { tn = { value: l.text.replace(/\s+/g, '').toUpperCase(), company: r.company, company_name: r.name, method: 'ocr', confidence: l.confidence, status: 'ok' }; break; }
    }
    return { full_text, lines, tracking_number: tn, latency_ms: Math.round(performance.now() - t0) };
  } catch (e) { return null; }
}

// ---------- YOLO 检测（扩展功能：预训练 YOLOv8n，onnxruntime-web 纯前端推理） ----------
// 保证 fallback：引擎/模型/推理任一失败 → 返回 null，调用方跳过，不影响扫码/OCR。
// 权重路径 ./models/yolov8n.onnx（同源 GH Pages 托管）——将来换成微调后的"单号区域"检测权重即换功能，无需改代码。
let yoloSession = null;
const YOLO_MODEL_URL = './models/yolov8n.onnx';
const YOLO_SIZE = 640;
const YOLO_CONF = 0.25, YOLO_IOU = 0.45;
const COCO_CLASSES = ['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors','teddy bear','hair drier','toothbrush'];
async function loadOrt() {
  if (window.ort) return true;
  try { await loadScript('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0/dist/ort.min.js'); } catch (e) {}
  return !!window.ort;
}
async function loadYolo() {
  if (yoloSession) return true;
  if (!(await loadOrt())) return false;
  try {
    yoloSession = await ort.InferenceSession.create(YOLO_MODEL_URL, { executionProviders: ['webgpu', 'wasm'] });
    return true;
  } catch (e) { return false; }
}
function letterbox(img, size) {
  const iw = img.width, ih = img.height;
  const scale = Math.min(size / iw, size / ih);
  const nw = Math.round(iw * scale), nh = Math.round(ih * scale);
  const padX = (size - nw) / 2, padY = (size - nh) / 2;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.drawImage(img, padX, padY, nw, nh);
  const imageData = ctx.getImageData(0, 0, size, size);
  const data = new Float32Array(3 * size * size);
  let p = 0;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const idx = (y * size + x) * 4;
    data[p] = imageData.data[idx] / 255;
    data[p + size * size] = imageData.data[idx + 1] / 255;
    data[p + 2 * size * size] = imageData.data[idx + 2] / 255;
    p++;
  }
  return { data, scale, padX, padY };
}
function iou(a, b) {
  const ax1 = a[0], ay1 = a[1], ax2 = a[0] + a[2], ay2 = a[1] + a[3];
  const bx1 = b[0], by1 = b[1], bx2 = b[0] + b[2], by2 = b[1] + b[3];
  const ix = Math.max(0, Math.min(ax2, bx2) - Math.max(ax1, bx1));
  const iy = Math.max(0, Math.min(ay2, by2) - Math.max(ay1, by1));
  const inter = ix * iy;
  const union = a[2] * a[3] + b[2] * b[3] - inter;
  return union > 0 ? inter / union : 0;
}
function postprocessYolo(out, scale, padX, padY) {
  const num = out.length / 84;
  const cands = [];
  for (let i = 0; i < num; i++) {
    const base = i * 84;
    const cx = out[base], cy = out[base + 1], w = out[base + 2], h = out[base + 3];
    let best = -1, bestScore = 0;
    for (let c = 4; c < 84; c++) { const s = out[base + c]; if (s > bestScore) { bestScore = s; best = c - 4; } }
    if (bestScore >= YOLO_CONF) {
      cands.push({ cls: best, score: bestScore,
        box: [(cx - w / 2 - padX) / scale, (cy - h / 2 - padY) / scale, w / scale, h / scale] });
    }
  }
  cands.sort((a, b) => b.score - a.score);
  const picked = [];
  for (const c of cands) {
    let dup = false;
    for (const p of picked) { if (p.cls === c.cls && iou(p.box, c.box) > YOLO_IOU) { dup = true; break; } }
    if (!dup) picked.push(c);
  }
  return picked.map(d => ({ class: COCO_CLASSES[d.cls] || String(d.cls), score: Math.round(d.score * 100) / 100, box: d.box.map(v => Math.round(v)) }));
}
async function runYolo(blob) {
  const t0 = performance.now();
  status('YOLO：加载引擎/模型…（首次需联网加载 ort 引擎；模型 ~13MB 同源，之后走浏览器缓存）');
  if (!(await loadYolo())) { status('YOLO 引擎/模型加载失败——已跳过，不影响扫码/OCR'); return null; }
  status('YOLO 推理中…（WebGPU 可用则加速，否则 WASM）');
  try {
    const bmp = await createImageBitmap(blob);
    const imgW = bmp.width, imgH = bmp.height;
    const { data, scale, padX, padY } = letterbox(bmp, YOLO_SIZE);
    bmp.close();
    const feeds = {};
    feeds[yoloSession.inputNames[0]] = new ort.Tensor('float32', data, [1, 3, YOLO_SIZE, YOLO_SIZE]);
    const outputs = await yoloSession.run(feeds);
    const out = outputs[yoloSession.outputNames[0]].data;
    const detections = postprocessYolo(out, scale, padX, padY);
    return { engine: 'onnxruntime-web', ep: (navigator.gpu ? 'webgpu' : 'wasm') + '|wasm', imgW, imgH,
             detections, latency_ms: Math.round(performance.now() - t0) };
  } catch (e) { return null; }
}
function drawYolo(blob, dets, imgW, imgH) {
  const cv = document.getElementById('yoloCanvas');
  if (!dets || !dets.length) { cv.hidden = true; return; }
  cv.hidden = false;
  cv.width = imgW; cv.height = imgH;
  const ctx = cv.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    const lw = Math.max(2, imgW / 300), fs = Math.max(13, imgW / 40);
    ctx.lineWidth = lw; ctx.strokeStyle = '#ff5252';
    ctx.font = fs + 'px sans-serif';
    for (const d of dets) {
      ctx.strokeRect(d.box[0], d.box[1], d.box[2], d.box[3]);
      ctx.fillStyle = 'rgba(255,82,82,.85)';
      ctx.fillText(d.class + ' ' + d.score, d.box[0], Math.max(fs, d.box[1] - 6));
    }
  };
  img.src = URL.createObjectURL(blob);
}

// ---------- OCR 基准（手机实测：合成面单样本 → chi_sim 计时） ----------
function makeSampleBlob() {
  const cv = document.createElement('canvas');
  cv.width = 1240; cv.height = 1754;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 90px sans-serif'; ctx.fillText('顺丰速运 SF EXPRESS', 60, 160);
  ctx.font = 'bold 170px sans-serif'; ctx.fillText('SF123456789012', 60, 420);
  ctx.font = '56px sans-serif';
  ctx.fillText('收件人：张三 13800138000', 60, 600);
  ctx.fillText('地址：浙江省杭州市西湖区文三路 1 号', 60, 700);
  ctx.fillText('快递单号 SF123456789012', 60, 820);
  for (let x = 0; x < 900; x += 6) ctx.fillRect(60 + x, 880, 3, 40);
  return new Promise(r => cv.toBlob(b => r(b), 'image/png'));
}
async function benchOcr() {
  status('基准：绘制样本图并加载 OCR 引擎…（首次含 20MB 中文模型下载）');
  const blob = await makeSampleBlob();
  const t0 = performance.now();
  const w = await Tesseract.createWorker(OCR_LANG, 1, { langPath: OCR_LANG_PATH });
  const loadMs = performance.now() - t0;
  const t1 = performance.now(); const r1 = await w.recognize(blob); const warmMs = performance.now() - t1;
  const t2 = performance.now(); const r2 = await w.recognize(blob); const steadyMs = performance.now() - t2;
  await w.terminate();
  return { sample: '合成面单 1240x1754', engine: 'tesseract.js@5 chi_sim', load_ms: Math.round(loadMs),
           recognize_warm_ms: Math.round(warmMs), recognize_steady_ms: Math.round(steadyMs),
           found_sf: /SF123456789012/.test((r2.data && r2.data.text) || '') };
}

// ---------- UI 粘合 ----------
const $ = id => document.getElementById(id);
function status(msg) { $('status').textContent = msg; }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
async function copyJson() {
  if (!lastJson) return;
  try { await navigator.clipboard.writeText(JSON.stringify(lastJson, null, 2)); toast('已复制'); }
  catch (e) { prompt('浏览器不允许自动复制，请手动复制：', JSON.stringify(lastJson, null, 2)); }
}
$('btnCamera').addEventListener('click', startLive);
$('btnStop').addEventListener('click', stopLive);
$('fileInput').addEventListener('change', e => { if (e.target.files && e.target.files[0]) onFile(e.target.files[0]); e.target.value = ''; });
$('btnCopy').addEventListener('click', copyJson);
$('btnOcr').addEventListener('click', () => {
  ocrEnabled = !ocrEnabled;
  $('btnOcr').textContent = '🔤 OCR 兜底：' + (ocrEnabled ? '开' : '关');
  $('btnOcr').classList.toggle('off', !ocrEnabled);
  status('OCR 兜底已' + (ocrEnabled ? '开启' : '关闭') + '：条码未命中时' + (ocrEnabled ? '自动尝试 OCR 提取单号' : '不触发 OCR'));
});
$('btnYolo').addEventListener('click', async () => {
  if (!lastFile) { status('先拍/选一张图片，再点 YOLO 检测'); return; }
  const yolo = await runYolo(lastFile);
  if (yolo) {
    if (!lastJson) lastJson = {};
    lastJson.yolo = yolo;
    drawYolo(lastFile, yolo.detections, yolo.imgW, yolo.imgH);
    render(lastJson);
    status('YOLO：检出 ' + yolo.detections.length + ' 个目标（' + yolo.ep + ' · ' + yolo.latency_ms + 'ms）——预训练 COCO 权重为管线验证，单号区域检测需微调后换权重');
  }
});
$('btnBench').addEventListener('click', async () => {
  const bench = await benchOcr();
  if (!bench) { status('基准失败'); return; }
  if (!lastJson) lastJson = {};
  lastJson.bench = bench;
  render(lastJson);
  status('基准完成：模型加载 ' + bench.load_ms + 'ms · 首次识别 ' + bench.recognize_warm_ms + 'ms · 稳态识别 ' + bench.recognize_steady_ms + 'ms · 识别到单号=' + bench.found_sf + ' —— 手机实测请在同一页面跑并报数');
});

window.addEventListener('DOMContentLoaded', async () => {
  try {
    await initEngine();
    $('engine').textContent = '引擎：' + (engine.kind === 'native' ? '原生 BarcodeDetector（' + engine.detector.formats.length + ' 格式）' : 'ZXing-js（CDN 兜底）');
  } catch (e) {
    $('engine').textContent = '引擎初始化失败：' + e.message;
    $('status').textContent = '无法扫码；请换新版 Chrome / Safari，或转路线 B（后端 API）';
  }
});
</script>
